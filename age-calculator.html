    .theme-toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform var(--transition);}
    [data-theme="dark"] .theme-toggle::after{transform:translateX(22px);}

    .hero-icon{font-size:3rem;margin-bottom:12px;}
    .hero h1{font-family:'Syne',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-1px;margin-bottom:8px;}

    .hero p{color:var(--text2);font-size:1rem;}
    .container{max-width:600px;margin:0 auto;padding:0 20px 60px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:var(--card-shadow);animation:fadeUp .3s ease;}

    label{display:block;font-size:.78rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:8px;}

    input:focus,select:focus{border-color:var(--accent);}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:500px){.row{grid-template-columns:1fr;}}
    .btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity var(--transition),transform var(--transition);}
    .btn:hover{opacity:.9;transform:translateY(-1px);}
    .result{margin-top:20px;padding:20px 24px;background:linear-gradient(135deg,var(--accent-light),var(--surface2));border:1.5px solid var(--accent);border-radius:16px;display:none;animation:fadeUp .25s ease;}
    .result.show{display:block;}
    .result-label{font-size:.75rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
    .result-value{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--text);}
    .result-sub{font-size:.85rem;color:var(--text2);margin-top:4px;}
    .other-tools{max-width:600px;margin:0 auto;padding:0 20px 60px;}
    .other-tools h3{font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:14px;}
    .tools-chips{display:flex;flex-wrap:wrap;gap:10px;}

    footer{text-align:center;padding:24px;font-size:.82rem;color:var(--text2);border-top:1px solid var(--border);}

<div class="container">

    <div class="field"><label>Your Date of Birth</label><input type="date" id="ageDob"/></div>

<script>

  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }

function calcAge(){
    const dob=new Date(document.getElementById('ageDob').value);
    if(!document.getElementById('ageDob').value)return alert('Please enter your date of birth');
    const today=new Date();
    let y=today.getFullYear()-dob.getFullYear(),m=today.getMonth()-dob.getMonth(),d=today.getDate()-dob.getDate();
    if(d<0){m--;d+=new Date(today.getFullYear(),today.getMonth(),0).getDate();}
    if(m<0){y--;m+=12;}
    const totalDays=Math.floor((today-dob)/86400000);
    document.getElementById('ageValue').textContent=y+' yrs, '+m+' mos, '+d+' days';
    document.getElementById('ageSub').textContent='That\'s '+totalDays.toLocaleString()+' total days lived!';
    document.getElementById('ageResult').classList.add('show');
  }
</script>
